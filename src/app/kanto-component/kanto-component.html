<div class="region-container">
  <h2>Kanto Region</h2>
  <p>These are my six favorite Pokemon from the Kanto region.</p>

  <div class="grid">
    @for (pokemon of kantoPokemon(); track pokemon.id) {
      <app-pokemon-card
        [pokemon]="pokemon">
      </app-pokemon-card>
    }
  </div>
</div>
