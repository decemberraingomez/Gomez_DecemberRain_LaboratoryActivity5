<div class="card">
  <p class="dex">{{ dexNumber() }}</p>
  <h3>{{ pokemon().name }}</h3>

  <p>
    <strong>Type:</strong>
    @for (type of pokemon().types; track type) {
      <span class="type {{ 'type-' + type.toLowerCase() }}">{{ type }}</span>
    }
  </p>
  <p><strong>Held Item:</strong> {{ pokemon().heldItem }}</p>
  <p class="description">{{ pokemon().description }}</p>
</div>
