<div class="region-container">
  <h2>Johto Region</h2>
  <p>These are my six favorite Pokemon from the Johto region.</p>
  <p class="count">Favorites in this region: {{ favoritesHere() }} of {{ johtoPokemon().length }}</p>

  <div class="grid">
    @for (pokemon of johtoPokemon(); track pokemon.id) {
      <app-pokemon-card
        [pokemon]="pokemon"
        [isFavorite]="pokemonService.isFavorite(pokemon.name)"
        (favoriteToggled)="onFavoriteToggled($event)">
      </app-pokemon-card>
    }
  </div>
</div>
